layout:
  zmk_keyboard: corne
  layout_name: foostan_corne_6col_layout
layers:
  Base:
    - [Tab, {t: "'", s: '"'}, {t: ",", s: "!"}, {t: ".", s: "?"}, P, Y, F, G, C, R, L, {t: /, s: "\\"}]
    - [{t: Esc, h: Ctrl}, A, O, E, U, I, D, H, T, N, S, {t: "-", s: _}]
    - [Shift, {t: ;, s: ":"}, Q, J, K, X, B, M, W, V, Z, {t: Bspc, h: Shift}]
    - [Gui, {t: Del, h: Lower}, Space, Enter, {t: Bspc, h: Raise}, Alt]
  Lower:
    - [{t: ▽, type: trans}, Home, Word Left, Up, Word Right, PgUp, "~", "7", "8", "9", "+", /]
    - [{t: ▽, type: trans}, End, Left, Down, Right, PgDn, "|", "4", "5", "6", "=", "-"]
    - [{t: ▽, type: trans}, Undo, Cut, Copy, Paste, PrtSc, "&", "1", "2", "3", "*", {t: ▽, type: trans}]
    - [{t: ▽, type: trans}, {type: held}, {t: ▽, type: trans}, Enter, "0", .]
  Raise:
    - [{t: ▽, type: trans}, "`", "@", "[", "]", "^", Vol Up, F1, F2, F3, F4, BT0]
    - [{t: ▽, type: trans}, "#", "*", "(", ")", $, Vol Down, F5, F6, F7, F8, BT1]
    - [{t: ▽, type: trans}, "<", ">", "{", "}", "%", Mute, F9, F10, F11, F12, BT CLR]
    - [{t: ▽, type: trans}, {t: ▽, type: trans}, {t: ▽, type: trans}, {t: ▽, type: trans}, {type: held}, {t: ▽, type: trans}]
combos:
  - {p: [3, 11], k: ../, l: [Base], a: top}
